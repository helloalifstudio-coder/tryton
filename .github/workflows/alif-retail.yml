name: Alif Retail module tests

on:
  push:
    branches:
      - production/8.0-lts
    paths:
      - "modules/alif_retail/**"
      - ".github/workflows/alif-retail.yml"
      - ".gitlab-ci-modules.yml"
  pull_request:
    branches:
      - production/8.0-lts
    paths:
      - "modules/alif_retail/**"
      - ".github/workflows/alif-retail.yml"
      - ".gitlab-ci-modules.yml"

permissions:
  contents: read

jobs:
  sqlite:
    name: Alif Retail / SQLite / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tox
        run: python -m pip install --upgrade pip tox
      - name: Run module test suite
        working-directory: modules/alif_retail
        run: tox -e py312-sqlite

  postgresql:
    name: Alif Retail / PostgreSQL 16 / Python 3.12
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tryton_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tryton_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRESQL_URI: postgresql://postgres:postgres@127.0.0.1:5432/tryton_test
      DB_NAME: tryton_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tox
        run: python -m pip install --upgrade pip tox
      - name: Run module test suite
        working-directory: modules/alif_retail
        run: tox -e py312-postgresql
