name: Alif Retail operations checks

on:
  push:
    branches:
      - production/8.0-lts
    paths:
      - "deploy/local/**"
      - ".github/workflows/alif-retail-ops.yml"
  pull_request:
    branches:
      - production/8.0-lts
    paths:
      - "deploy/local/**"
      - ".github/workflows/alif-retail-ops.yml"

permissions:
  contents: read

jobs:
  shell:
    name: Backup script syntax and ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: bash -n deploy/local/backup-showroom.sh
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Lint backup script
        run: shellcheck --severity=style deploy/local/backup-showroom.sh
